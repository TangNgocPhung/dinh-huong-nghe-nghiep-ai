<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làm trắc nghiệm | Định Hướng Nghề Nghiệp AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="index.html">🧭 Định Hướng Nghề Nghiệp</a>
      <nav class="site-nav">
        <a href="index.html">Trang chủ</a>
        <a href="assessments.html" class="active">Bài trắc nghiệm</a>
        <a href="profile.html">Hồ sơ của tôi</a>
        <a href="careers.html">Tra cứu ngành nghề</a>
        <a href="chatbot.html">Hỏi đáp AI</a>
        <a href="about.html">Giới thiệu</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container" id="quiz-container">
      <p>Đang tải bài trắc nghiệm...</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Đề tài NCKH học sinh THPT — Hệ thống hỗ trợ tự nhận thức năng lực &amp; định hướng nghề nghiệp tích hợp AI.</div>
  </footer>

  <script src="js/quiz-engine.js"></script>
  <script>
    function externalAssessmentMarkup(id, name, url) {
      return `
        <section class="external-assessment" aria-labelledby="${id}-assessment-title">
          <div class="external-assessment-head">
            <div>
              <span class="live-dot">Công cụ trực tuyến</span>
              <h2 id="${id}-assessment-title">Làm trắc nghiệm ${name}</h2>
              <p>Thực hiện bài trắc nghiệm ngay trong khung bên dưới. Nếu khung hiển thị chưa đầy đủ, bạn có thể mở công cụ ở một tab riêng.</p>
            </div>
            <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener noreferrer">Mở toàn màn hình ↗</a>
          </div>
          <div class="external-frame-wrap">
            <iframe
              class="external-assessment-frame"
              src="${url}"
              title="Trắc nghiệm ${name} của Hướng nghiệp Sông An"
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>
          <p class="external-source">Nguồn công cụ: <a href="${url}" target="_blank" rel="noopener noreferrer">Hướng nghiệp Sông An ↗</a></p>
        </section>
      `;
    }

    function renderHollandExternal(container) {
      const hollandUrl = "https://tracnghiem.huongnghiepsongan.com/assess/tracnghiem/HLKPST1622";
      container.innerHTML = `
        <div class="theory-intro holland-intro">
          <div class="theory-copy holland-copy">
            <a class="back-link" href="assessments.html">← Quay lại danh sách bài trắc nghiệm</a>
            <span class="eyebrow">🧭 Khám phá sở thích nghề nghiệp</span>
            <h1>Lý thuyết lựa chọn nghề nghiệp <span>— John L. Holland</span></h1>
            <p>Trắc nghiệm Holland (RIASEC) được xây dựng dựa trên lý thuyết lựa chọn nghề nghiệp của nhà tâm lý học John L. Holland, nhằm khám phá sở thích và xu hướng nghề nghiệp của mỗi cá nhân.</p>
            <p>Mô hình phân chia sở thích thành 6 nhóm cơ bản: Realistic (Kỹ thuật), Investigative (Nghiên cứu), Artistic (Nghệ thuật), Social (Xã hội), Enterprising (Quản lý) và Conventional (Nghiệp vụ).</p>
            <p>Kết quả trắc nghiệm cho biết những nhóm sở thích nổi trội của học sinh và mối liên hệ với các nhóm môi trường nghề nghiệp có xu hướng phù hợp, đóng vai trò nền tảng khoa học trong quá trình định hướng nghề nghiệp.</p>
          </div>

          <div class="riasec-model" aria-label="Sáu nhóm sở thích nghề nghiệp RIASEC">
            <div class="riasec-center"><strong>RIASEC</strong><span>6 nhóm sở thích</span></div>
            <article class="riasec-type type-r"><b>R</b><strong>Kỹ thuật</strong><small>Realistic</small></article>
            <article class="riasec-type type-i"><b>I</b><strong>Nghiên cứu</strong><small>Investigative</small></article>
            <article class="riasec-type type-a"><b>A</b><strong>Nghệ thuật</strong><small>Artistic</small></article>
            <article class="riasec-type type-s"><b>S</b><strong>Xã hội</strong><small>Social</small></article>
            <article class="riasec-type type-e"><b>E</b><strong>Quản lý</strong><small>Enterprising</small></article>
            <article class="riasec-type type-c"><b>C</b><strong>Nghiệp vụ</strong><small>Conventional</small></article>
          </div>
        </div>
        ${externalAssessmentMarkup("holland", "Holland", hollandUrl)}
      `;
    }

    function renderMIExternal(container) {
      const miUrl = "https://tracnghiem.huongnghiepsongan.com/assess/tracnghiem/MIPQVI";
      container.innerHTML = `
        <div class="theory-intro mi-intro">
          <div class="theory-copy mi-copy">
            <a class="back-link" href="assessments.html">← Quay lại danh sách bài trắc nghiệm</a>
            <span class="eyebrow">🧠 Nhận diện thế mạnh của bạn</span>
            <h1>Trắc nghiệm Đa trí thông minh <span>— Howard Gardner</span></h1>
            <p>Trắc nghiệm Đa trí thông minh (Multiple Intelligences) dựa trên Thuyết Đa trí thông minh do nhà tâm lý học Howard Gardner đề xuất năm 1983.</p>
            <p>Lý thuyết cho rằng con người có thể biểu hiện năng lực nổi trội ở nhiều dạng khác nhau: ngôn ngữ, logic – toán học, không gian, âm nhạc, vận động (thể chất), giao tiếp (tương tác cá nhân), nội tâm (tự nhận thức) và tự nhiên.</p>
            <p>Bài trắc nghiệm giúp học sinh nhận diện những dạng năng lực mà bản thân có xu hướng phát huy, từ đó hỗ trợ lựa chọn phương pháp học tập và định hướng phát triển phù hợp với thế mạnh cá nhân.</p>
          </div>

          <div class="mi-model" aria-label="Tám dạng trí thông minh theo Howard Gardner">
            <div class="mi-center"><strong>MI</strong><span>8 dạng trí thông minh</span></div>
            <article class="mi-type mi-language"><span>🔤</span><strong>Ngôn ngữ</strong><small>Linguistic</small></article>
            <article class="mi-type mi-logic"><span>🧮</span><strong>Logic – toán học</strong><small>Logical</small></article>
            <article class="mi-type mi-space"><span>🧊</span><strong>Không gian</strong><small>Spatial</small></article>
            <article class="mi-type mi-music"><span>🎵</span><strong>Âm nhạc</strong><small>Musical</small></article>
            <article class="mi-type mi-body"><span>🏃</span><strong>Vận động</strong><small>Bodily</small></article>
            <article class="mi-type mi-social"><span>🤝</span><strong>Giao tiếp</strong><small>Interpersonal</small></article>
            <article class="mi-type mi-self"><span>🪞</span><strong>Nội tâm</strong><small>Intrapersonal</small></article>
            <article class="mi-type mi-nature"><span>🌿</span><strong>Tự nhiên</strong><small>Naturalistic</small></article>
          </div>
        </div>
        ${externalAssessmentMarkup("mi", "Đa trí thông minh (MI)", miUrl)}
      `;
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const testId = params.get("test");
      const container = document.getElementById("quiz-container");

      if (!testId) {
        container.innerHTML = `<p>Thiếu tham số bài test. Hãy quay lại <a href="assessments.html">danh sách bài trắc nghiệm</a>.</p>`;
        return;
      }

      if (testId === "holland") {
        renderHollandExternal(container);
        return;
      }

      if (testId === "mi") {
        renderMIExternal(container);
        return;
      }

      let quiz;
      try {
        quiz = await QuizEngine.loadQuiz(testId);
      } catch (err) {
        container.innerHTML = `<p>Không tải được bài test "${testId}". Lưu ý: bạn cần chạy trang qua một máy chủ cục bộ (xem README.md) thay vì mở trực tiếp file, để trình duyệt cho phép tải dữ liệu JSON.</p>`;
        return;
      }

      container.innerHTML = "";
      const form = QuizEngine.renderQuiz(quiz, container);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const answers = QuizEngine.collectAnswers(quiz, form);
        const result = quiz.scaleType === "likert5" ? QuizEngine.scoreLikert(quiz, answers) : QuizEngine.scoreBinary(quiz, answers);
        QuizEngine.saveResult(testId, result);
        QuizEngine.renderResults(quiz, result, container);
      });
    }
    main();
  </script>
  <script src="js/site.js"></script>
</body>
</html>
